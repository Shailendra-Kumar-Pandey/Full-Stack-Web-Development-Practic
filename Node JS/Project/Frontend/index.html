<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Student Data</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Student Data</h1>
        </div>
        <button onclick="openClose('addModal')">Add Student</button>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>S.No.</th>
                        <th>Brand</th>
                        <th>Title</th>
                        <th>Price</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tBody">
            <!--    <tr>
                        <td>1</td>
                        <td>Apple</td>
                        <td>iPhone 13 Pro</td>
                        <td>₹ 999</td>
                        <td>
                            <button class="action-btn edit-btn">Edit</button>
                            <button class="action-btn delete-btn">Delete</button>
                        </td>
                    </tr> -->
                </tbody>
            </table>
        </div>
    </div>
    <!-- Add Product Modal -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <button id="btn-close" onclick="openClose('addModal')"> X </button>
            <h2>Add Product</h2>
            <div class="inner-content">
                <input type="text" placeholder="Enter Brand Name" onkeyup="addnewproduct('brand', this.value)" id="brand">
                <input type="text" placeholder="Enter Title " onkeyup="addnewproduct('title', this.value)" id="title">
                <input type="number" placeholder="Enter Price " onkeyup="addnewproduct('price', this.value)" id="price">
                <input type="url" placeholder="Enter Brand Image URL" onkeyup="addnewproduct('imgURL', this.value)" id="imgURL">
                <textarea type="text" placeholder="Enter Desecription" onkeyup="addnewproduct('desc', this.value)" id="desc"></textarea>
                <button class="btn_style" onclick="addProduct()">Add Product</button>
            </div>
        </div>     
    </div>

    <!-- Edit Product Modal -->
     <div class="modal" id="editModal">
        <div class="modal-content">
            <button id="btn-close" onclick="openClose('editModal')"> X </button>
            <h2>Update Product</h2>
            <div class="inner-content">
                <input type="text" placeholder="Enter Brand Name" id="brandUpdate" onkeyup="updateProduct('brand', this.value)">
                <input type="text" placeholder="Enter Title "  id="titleUpdate" onkeyup="updateProduct('title', this.value)">
                <input type="number" placeholder="Enter Price "  id="priceUpdate" onkeyup="updateProduct('price', this.value)">
                <input type="url" placeholder="Enter Brand Image URL" id="imgURLUpdate" onkeyup="updateProduct('imgURL', this.value)">
                <textarea type="text"  placeholder="Enter Description" id="descUpdate" onkeyup="updateProduct('desc', this.value)"></textarea>
                <button class="btn_style" onclick="UpdateProduct()">Update Product</button>
            </div>
        </div>     
    </div>

    <!-- Delete Product Modal -->
     <div class="modal" id="deleteModal">
        <div class="modal-content">
            <button id="btn-close" onclick="openClose('deleteModal')"> X </button>
            <h2>Delete Product</h2>
            <p>Are you sure you want to delete this product?</p>
            <button onclick="confirmValue()" class="btn_style" id="confirm"> Yes </button>
            <button class="btn_style" value="false" onclick="openClose('deleteModal')"> Cancel </button>
        </div>     
    </div>
    <script src="./main.js"></script>
</body>
</html>
