<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 02</title>
</head>
<body>
    <h1>User Form</h1>

    <input type="password" id="Password" placeholder="Enter Your Password"><br><br>
    <button id="TogglePassword" onclick="togglePassword()">Show Password-Hide Password</button>

    <script>
        // Get Password Input Field
        let value = document.getElementById("Password");
        //This Function is used to toggle the password visibility
        function togglePassword() {
            if (value.type === "password") {        // Check the type of input field
                value.type = "text";
            } else {
                value.type = "password";
            }
            // console.log(value.value)        // Print the value of input field in console
        }
    </script>

</body>
</html>
