<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practic 3</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        #box{
            width: 200px;
            height: 200px;
            background-color: lightcoral;
        }
        button{
            background-color: #fff;
            color: #333;
            padding: 2px;
            margin-top: 2px;
            border-radius: 10px ;
        }
        button:hover{
            color: #fff;
            background-color: #333;
        }
    </style>
</head>
<body>
    <div id="box"></div>
    <button onclick="randamColor()">Change Random Background Color</button> <!-- Event listener -->
    <script>
        const box = document.getElementById("box");

        function randamColor(){                 // Event handler function
            box.style.background = rgbColor();
        }

        function rgbColor(){
            let r = Math.round(Math.random() * (255 - 0) + 0)
            let g = Math.round(Math.random() * (255 - 0) + 0)
            let b = Math.round(Math.random() * (255 - 0) + 0)
            return `rgb(${r}, ${g}, ${b})`          // Template literal
        }
    </script>
</body>
</html>
