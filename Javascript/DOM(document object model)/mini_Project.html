<!-- using Single function for event handling  -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Layout</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Header */
    header {
      background-color: #4CAF50;
      color: white;
      padding: 15px 20px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    /* Main container (Sidebar + Content) */
    .container {
      display: flex;
      flex: 1;
    }

    /* Sidebar */
    .sidebar {
      width: 200px;
      background-color: #333;
      color: white;
      padding-top: 20px;
      position: fixed;
      left: -240px;
      height: 100vh;

    }

    .sidebar a {
      display: block;
      color: white;
      padding: 12px;
      text-decoration: none;
    }

    .sidebar a:hover {
      background-color: #575757;
    }

    /* Content Area */
    .content {
      flex: 1;
      padding: 20px;
      background-color: #f4f4f4;
    }
    #btn {
      position: absolute;
      top: 10px;
      right: 20px;
      padding: 10px 15px;
      background-color: #fff;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    My Website - Header
    <button id="btn" onclick="toggleSidebar()">Toggle Sidebar</button>
  </header>

  <!-- Main Layout -->
  <div class="container">
    
    <!-- Sidebar -->
    <div class="sidebar">
      <a href="#">Home</a>
      <a href="#">Profile</a>
      <a href="#">Settings</a>
      <a href="#">Logout</a>
    </div>

    <!-- Content -->
    <div class="content">
      <h2>Welcome to the Content Area</h2>
      <p>This is where your main content will appear.</p>
      <p>You can add articles, images, or anything here.</p>
    </div>

  </div>

  <script>
    let openClose = false;
    const toggleSidebar = ()=>{
        let sidebar = document.getElementsByClassName("sidebar")[0];
        let content = document.getElementsByClassName("content")[0];
        if(openClose === true){
            sidebar.style.left="-240px";
            sidebar.style.transition="all 0.5s";
            content.style.marginLeft="0px";
            content.style.transition="all 0.5s";
            openClose = false
        }else{
            sidebar.style.left="0px";
            sidebar.style.transition="all 0.5s";
            content.style.marginLeft="240px";
            content.style.transition="all 0.5s";
            openClose = true
        }
    }

  </script>

</body>
</html>
