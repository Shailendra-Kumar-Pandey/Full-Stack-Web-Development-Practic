<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call back Hell</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body{
            margin: 10px;
            background-color: rgb(209, 228, 235);
        }
        h1{
            text-align: center;
            font-size: 3em;
            color: #333;
        }

    </style>
</head>
<body>
    <h1>callBacks hell</h1>

    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>S.No.</th>
                    <th>Full Name</th>
                    <th>Gender</th>
                    <th>Age</th>
                </tr>
            </thead>
            <tbody id="user">
                <tr>
                    <td>1</td>
                    <td>Jeetu</td>
                    <td>Male</td>
                    <td>29</td>
                </tr>
            </tbody>
        </table>
    </div>


    <script>
        
        function networkAPI(reqURL, callBack) {
            const http = new XMLHttpRequest()
            http.open("GET", reqURL, true);
            http.onreadystatechange = function (){
                if(http.readyState === 4){
                    if(http.status === 200){
                        let result = JSON.parse(http.response);
                        callBack(result, null);
                    }else{
                        callBack(null ,`Something went wrong...! ${reqURL}`)
                    }
                }
            }
            http.send();
        }

        networkAPI("https://jsonplaceholder.typicode.com/users", function (response, error) {
            if (error === null) {
                console.log(response);
                networkAPI("https://jsonplaceholder.typicode.com/posts", function(response, error){
                    if (error === null) {
                        console.log(response)
                        networkAPI( "https://jsonplaceholder.typicode.com/comments",function(response, error){
                            if(error === null){
                                console.log(response)
                            }else{
                                console.log(error)
                            }
                        })
                    }else{
                        console.log(error)
                    }
                })
            }else{
                console.log(error);
            }
        });
        
        // callback hell:- multiple nested callbacks making code hard to read and maintain.
        // callback functions are often used for asynchronous operations, such as network requests, timers, and event handling.
        // callback hell can lead to code that is difficult to read, understand, and maintain.
        // To avoid callback hell, you can use techniques such as:
        // callback functions:- what is call back fuction?
        // A callback function is a function that is passed as an argument to another function and is executed after some operation is completed.
        // Solution: Use Promises or Async/Await


        // example of callback:-
        function greet(name, callback) {
            console.log('Hello ' + name);
            callback();
        }
        function sayGoodbye() {
            console.log('Goodbye!');
        }
        greet('Alice', sayGoodbye);
        
    </script>
</body>
</html>
