<!-- Synchronous and Asynchronous

// Synchronous JavaScript:
Execution Flow: Code executes sequentially, line by line, from top to bottom. 
                Each operation must complete before the next one can begin.
Blocking Nature: If a synchronous operation takes a long time (e.g., a complex calculation or a synchronous network request),
             it will "block" the execution of the rest of the code until it finishes. This can lead to a frozen user interface and a poor user experience.

// Asynchronous JavaScript:
Execution Flow: Operations can run independently, allowing other code to execute while a long-running task is in progress. 
                The result of the asynchronous operation will be handled later, once it's available.
Non-Blocking Nature: Asynchronous operations do not block the main thread of execution. 
                    This is crucial for maintaining a responsive user interface in web applications.
Mechanisms: JavaScript achieves asynchronicity through various mechanisms:

    Callbacks: Functions passed as arguments to be executed later when an asynchronous task completes.
    Promises: Objects representing the eventual completion (or failure) of an asynchronous operation, 
            allowing for more structured handling of results.
    async/await: Syntactic sugar built on top of Promises, providing a more readable and synchronous-like way to write asynchronous code.
    Web APIs: Browser features like
                                setTimeout,
                                setInterval,
                                fetch, and 
                                XMLHttpRequest enable asynchronous operations.


-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synchronous and Asynchronous</title>
    <style>
        *{
            margin: 10px;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Synchronous and Asynchronous</h1>


    <script>

        console.log("1")

        setTimeout(() => {
            console.log("2")
        }, 0);

        console.log("3")
        /*
        output:-    this is a asynchronous Nature :-
                    1
                    3
                    2
        */
    </script>

    
</body>
</html>
