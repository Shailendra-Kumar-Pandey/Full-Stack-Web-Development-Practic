<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Promise</title>
</head>
<body>
    <h1>Practice Promise</h1>


    <script>

        function apiCall(reqURL){
            return new Promise((response, reject)=>{
                let http = new XMLHttpRequest();
                http.open("GET", reqURL, true);
                http.onreadystatechange = function () {
                    if(http.readyState === 4){
                        if(http.status === 200){
                            let result = JSON.parse(http.response);
                            response(result)
                        }else{
                            reject(`Something went Wrong...! ${reqURL}`);
                        }
                    }
                }
                http.send();
            })
        }

        apiCall("https://jsonplaceholder.typicode.com/users")
        .then((res)=>{
            console.log(res);
            return apiCall("https://jsonplaceholder.typicode.com/posts");
        })
        .then((res)=>{
            console.log(res);
            return apiCall("https://jsonplaceholder.typicode.com/comments");
        })
        .then((res)=>{
            console.log(res);
        })
        .catch((err)=>{
            console.log(err);
        })

    </script>
</body>
</html>
