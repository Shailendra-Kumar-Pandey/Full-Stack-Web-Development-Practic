
<!-- setTimeout(function(), timer) :- this function will be execution time delay function called, 
syntex:-    setTimeout(function(){
                // code
            }, timer) 

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SetTimeout()</title>
    <style>
        *{
            margin: 10px;
            padding: 10px;
            font-family: sans-serif;
        }
        input,button{
            padding: 10px 20px;
            outline: none;
            border-radius: 10px ;
            border: 1px solid gray;
            font-size: 17px;
        }
        button{
            background-color: #333;
            color: azure;
        }
        div{
            background-color: green;
            padding: 10px 20px;
            color: azure;
            font-weight: bold;
            font-size: 17px;
            width: 250px;
            position: fixed;
            right: -300px ;
            bottom: 0px;
            transition: .3s;
        }
    </style>
</head>
<body>
    <input type="text" placeholder="Enter your Full Name">
    <button onclick="showMsg()">Submit</button>

    <div>
        <!-- Thank You Shailendra Pandey, submit your Feedback. -->
    </div>

    <script>
        // setTimeout() function:-

       /* setTimeout(()=>{
            console.log("hello timer hello")
        },2000)
        console.log("hello")*/

        let input = document.getElementsByTagName("input")[0];
        // input[0].value
        console.log(input)
        function showMsg(){
            document.getElementsByTagName("div")[0].innerText = `Thank You ${input.value}, Submited your Form.`
            document.getElementsByTagName("div")[0].style.right = "0px"
        
            setTimeout(function(){
                document.getElementsByTagName("div")[0].style.right = "-300px"
            }, 3000)
        }
        


    </script>
</body>
</html>
