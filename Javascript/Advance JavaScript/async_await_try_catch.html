<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async Await try catch</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        h1{
            margin-top: 40px;
            font-size: 50px;
            text-align: center;
            font-weight: 800;
        }
        button{
            display: block;
            margin: 40px auto;
            padding: 10px 20px;
            font-size: 20px;
            font-weight: 600;
            background-color: rgb(8, 8, 8);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>async function and await keyword,  try and catch statement </h1>


    <button onclick="doSomething()">Fetch Users</button>
    
    <script>
        // async function :- This function is using asyncronus task perform but await keyword using inside almost using this function.
       /*
        async function doSomething(){
            let res = await fetch("https://jsonplaceholder.typicode.com/users", {
                method : "GET"
            });
            let result = await res.json();
            console.log(result)
        }

        doSomething()
        */



   
        // using all ways try and catch statement then inside async-await function

        async function doSomething(url) {
        try {
                let res = await fetch(url, {
                    method : "GET"
                })
                let response = await res.json();
                console.log(response)
            } catch (error) {
                console.log(error)

                console.log("Error Occured")
            }
        }

        doSomething("https://jsonplaceholder.typicode.com/users")
        doSomething("https://jsonplaceholder.typicode.com/posts")
        doSomething("https://jsonplaceholder.typicode.com/comments")
    </script>
</body>
</html>
