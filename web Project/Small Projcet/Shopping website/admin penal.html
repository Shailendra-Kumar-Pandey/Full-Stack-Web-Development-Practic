<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Admin Panel</h1>
        </div>
        <button onclick="openClose()">Add Product</button>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>S.No.</th>
                        <th>Brand</th>
                        <th>Title</th>
                        <th>Price</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tBody">
            <!--    <tr>
                        <td>1</td>
                        <td>Apple</td>
                        <td>iPhone 13 Pro</td>
                        <td>₹ 999</td>
                        <td>
                            <button class="action-btn edit-btn">Edit</button>
                            <button class="action-btn delete-btn">Delete</button>
                        </td>
                    </tr> -->
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <button id="btn-close" onclick="openClose()"> X </button>
            <h2>Add Product</h2>
            <div class="inner-content">
                <input type="text" placeholder="Enter Brand Name" onkeyup="addnewproduct('brand', this.value)">
                <input type="text" placeholder="Enter Title " onkeyup="addnewproduct('title', this.value)">
                <input type="number" placeholder="Enter Price " onkeyup="addnewproduct('price', this.value)">
                <input type="url" placeholder="Enter Brand Image URL" onkeyup="addnewproduct('imgURL', this.value)">
                <textarea type="text" placeholder="Enter Desecription" onkeyup="addnewproduct('desc', this.value)"></textarea>
                    <button onclick="">Add Product</button>
            </div>
        </div>     
    </div>
    <script src="./js/admin.js"></script>
</body>
</html>
