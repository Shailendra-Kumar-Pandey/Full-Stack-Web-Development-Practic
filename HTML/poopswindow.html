<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Pop-up Modal</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome for Icons (Optional) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    /* Optional: Style the button */
    .open-btn {
      margin-top: 100px;
    }

    .modal-content {
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }

    .modal-header {
      background-color: #0d6efd;
      color: white;
      border-top-left-radius: 15px;
      border-top-right-radius: 15px;
    }

    .modal-footer {
      justify-content: center;
    }

    @media (max-width: 576px) {
      .modal-dialog {
        margin: 10px;
      }

      .modal-content {
        font-size: 15px;
      }
    }
  </style>
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100 bg-light">

  <!-- 🔘 Button to Open Modal -->
  <button type="button" class="btn btn-primary open-btn" data-bs-toggle="modal" data-bs-target="#exampleModal">
    <i class="fas fa-eye"></i> Open Pop-up Window
  </button>

  <!-- 💬 Modal Structure -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg"> <!-- modal-lg for wide screen -->
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel"><i class="fas fa-bell"></i> Notification</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body text-center">
          <p style="font-size: 18px;">
            🎉 Welcome to our responsive Bootstrap pop-up!<br>
            This window works beautifully on all screen sizes including mobile 📱, tablet 📲 and desktop 🖥️.
          </p>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-success" data-bs-dismiss="modal"><i class="fas fa-thumbs-up"></i> OK</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
