<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Message Box</title>
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      background-color: #f5f5f5;
      padding: 20px;
    }

    .message-box {
      max-width: 500px;
      margin: auto;
      background: #ffffff;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      padding: 25px;
    }

    .message-box h4 {
      margin-bottom: 15px;
    }

    .icon {
      font-size: 2rem;
      color: #0d6efd;
      margin-right: 10px;
    }

    .message-box textarea {
      resize: none;
    }
  </style>
</head>
<body>

<div class="message-box d-flex flex-column align-items-start">
  <div class="d-flex align-items-center mb-3">
    <i class="fas fa-envelope icon"></i>
    <h4 class="mb-0">Send Us a Message</h4>
  </div>

  <form class="w-100">
    <div class="mb-3">
      <label for="userName" class="form-label">Your Name</label>
      <input type="text" class="form-control" id="userName" placeholder="Enter your name">
    </div>

    <div class="mb-3">
      <label for="userEmail" class="form-label">Email address</label>
      <input type="email" class="form-control" id="userEmail" placeholder="name@example.com">
    </div>

    <div class="mb-3">
      <label for="messageText" class="form-label">Your Message</label>
      <textarea class="form-control" id="messageText" rows="4" placeholder="Type your message..."></textarea>
    </div>

    <button type="submit" class="btn btn-primary w-100">Send Message</button>
  </form>
</div>

<!-- Bootstrap JS (Optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
