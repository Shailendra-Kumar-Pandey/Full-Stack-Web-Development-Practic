<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auto Open Pop-up</title>

  <!-- ✅ Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- ✅ Font Awesome for icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    .modal-content {
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }

    .modal-header {
      background-color: #0d6efd;
      color: white;
      border-top-left-radius: 15px;
      border-top-right-radius: 15px;
    }

    .modal-footer {
      justify-content: center;
    }

    @media (max-width: 576px) {
      .modal-dialog {
        margin: 10px;
      }

      .modal-content {
        font-size: 15px;
      }
    }
  </style>
</head>
<body class="bg-light">

  <!-- 💬 Auto-Open Modal -->
  <div class="modal fade" id="autoModal" tabindex="-1" aria-labelledby="autoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="autoModalLabel"><i class="fas fa-info-circle"></i> Welcome!</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body text-center">
          <p style="font-size: 18px;">
            🎉 This pop-up opened automatically!<br>
            It's responsive and works on all devices — mobile, tablet, desktop.
          </p>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-success" data-bs-dismiss="modal">
            <i class="fas fa-check-circle"></i> Got it!
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ✅ Bootstrap Bundle JS (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ✅ Auto Show Modal on Page Load -->
  <script>
    window.addEventListener('load', function () {
      const myModal = new bootstrap.Modal(document.getElementById('autoModal'));
      myModal.show();
    });
  </script>
</body>
</html>
