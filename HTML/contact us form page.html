<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Us</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .contact-section {
            margin: 50px auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }

        .contact-image {
            background: url('./Customer-Portals.jpg') center center/cover no-repeat;
            min-height: 400px;
            border-radius: 10px;
        }

        .contact-form {
            padding: 40px;
        }

        .form-control,
        .btn {
            border-radius: 30px;
        }

        .form-icon {
            margin-right: 10px;
            color: #0d6efd;
        }

        @media (max-width: 768px) {
            .contact-image {
                min-height: 250px;
            }

            .contact-form {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container contact-section row">
        <!-- Image Section -->
        <div class="col-md-6 contact-image d-none d-md-block"></div>

        <!-- Form Section -->
        <div class="col-md-6 contact-form">
            <h3 class="mb-4"><i class="fas fa-envelope form-icon"></i> Contact Us</h3>

            <form>
                <div class="mb-3">
                    <label for="name" class="form-label"><i class="fas fa-user form-icon"></i> Your Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Enter name">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label"><i class="fas fa-envelope form-icon"></i> Email</label>
                    <input type="email" class="form-control" id="email" placeholder="example@email.com">
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label"><i class="fas fa-comment-dots form-icon"></i>
                        Message</label>
                    <textarea class="form-control" id="message" rows="4" placeholder="Write your message..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    <i class="fas fa-paper-plane me-2"></i> Send Message
                </button>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
